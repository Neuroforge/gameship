name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e . pytest
      - run: pytest -q

  # dogfood: build the example game on all three OSes with gameship itself,
  # then smoke-run the frozen binary headless
  example-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  bin: "dist/linux/Catcher/Catcher" }
          - { os: macos-latest,   bin: "dist/mac/Catcher/Catcher" }
          - { os: windows-latest, bin: "dist/windows/Catcher/Catcher.exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pygame-ce
      - name: build the example with gameship
        run: gameship build example --name Catcher
        shell: bash
      - name: smoke-run the frozen binary (headless, 120 frames)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          GAMESHIP_MAX_FRAMES: "120"
        run: ./example/${{ matrix.bin }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.os }}
          path: example/dist/
